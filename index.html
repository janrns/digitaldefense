<script id="dd-data" type="application/json">[{"id": "cyber-defence", "num": "01", "title": "Cyber Defence", "desc": "Fähigkeit, digitale Angriffe zu erkennen, abzuwehren, darauf zu reagieren und den Betrieb aufrechtzuerhalten.", "aspects": [{"name": "Detection (Angriffserkennung)", "leitfrage": "Werden sicherheitsrelevante Ereignisse der zentralen IT-Systeme systematisch protokolliert und ausgewertet, sodass Angriffe zeitnah erkannt werden – ggf. durch einen Dienstleister bzw. ein SOC (Security Operations Center)? Ist die Kommune an Warnstrukturen (BSI, Landes-CERT, d. h. ein Computer Emergency Response Team) angebunden?", "stufen": ["Sicherheitsrelevante Ereignisse werden nicht systematisch protokolliert. Angriffe fallen allenfalls zufällig oder über Störungsmeldungen auf. Eine Anbindung an Warnstrukturen besteht nicht.", "Einzelne Systeme protokollieren, die Auswertung erfolgt anlassbezogen und personenabhängig. Warnmeldungen (BSI, Landes-CERT) erreichen die Kommune, werden aber nicht strukturiert verarbeitet.", "Für die zentralen Systeme ist die Protokollierung definiert und wird zusammengeführt. Zuständigkeiten für die Auswertung sind geregelt, Warnmeldungen werden über einen definierten Prozess bewertet.", "Sicherheitsereignisse werden kontinuierlich überwacht, ggf. über ein ausgelagertes SOC. Erkennungsregeln und Erkennungszeiten werden über Kennzahlen gesteuert und regelmäßig überprüft.", "Die Erkennung wird anhand aktueller Bedrohungslagen und Threat Intelligence fortlaufend weiterentwickelt. Erkenntnisse werden mit CERT-Strukturen und anderen Kommunen ausgetauscht."]}, {"name": "Incident Response", "leitfrage": "Gibt es einen dokumentierten und regelmäßig geübten Reaktionsplan für Cyberangriffe mit klaren Rollen, Erreichbarkeiten und Meldewegen (u. a. BSI/Landes-CERT, Datenschutzaufsicht) – auch außerhalb der Dienstzeiten?", "stufen": ["Vorfälle werden ad hoc bewältigt. Rollen, Meldewege und Erreichbarkeiten sind nicht dokumentiert, das Vorgehen hängt von einzelnen Personen ab.", "Ein Notfallplan liegt in Teilen vor. Erste Rollen und Meldewege sind benannt, jedoch nicht organisationsweit bekannt und nicht geübt. Die Erreichbarkeit außerhalb der Dienstzeiten ist ungeklärt.", "Ein dokumentierter Incident-Response-Prozess mit Rollen, Erreichbarkeiten sowie Eskalations- und Meldewegen (BSI/Landes-CERT, Datenschutzaufsicht) besteht und ist bekannt.", "Der Prozess wird regelmäßig geübt und über Kennzahlen (z. B. Reaktionszeiten) gesteuert. Erkenntnisse aus Vorfällen und Übungen fließen systematisch in Anpassungen ein.", "Die Reaktionsfähigkeit ist auch bei komplexen Angriffslagen belastbar. Externe Unterstützung (Forensik, Landes-CERT, Dienstleister) ist vorbereitet abrufbar und wird eingeübt."]}, {"name": "Recovery", "leitfrage": "Können kritische Systeme und Daten aus offline bzw. unveränderbar gespeicherten Backups wiederhergestellt werden – und wurde die Wiederherstellung in den letzten 12 Monaten tatsächlich getestet (inkl. Wiederanlaufzeiten)?", "stufen": ["Backups bestehen, ihre Wiederherstellbarkeit ist ungetestet. Wiederanlaufzeiten sind unbekannt, ein Wiederherstellungsvorgehen ist nicht beschrieben.", "Ein Backup-Konzept liegt vor, einzelne Wiederherstellungen wurden durchgeführt. Offline- bzw. unveränderbare Sicherungen bestehen nur teilweise, Wiederanlaufreihenfolgen sind nicht festgelegt.", "Für kritische Systeme bestehen geschützte Sicherungen, definierte Wiederanlaufreihenfolgen und Zielvorgaben (RTO/RPO). Wiederherstellungen werden regelmäßig getestet.", "Die Wiederherstellung wird unter realistischen Bedingungen geübt, die Ergebnisse werden gegen RTO/RPO bewertet und Abweichungen abgestellt.", "Die Wiederherstellungsfähigkeit wird laufend an neue Systeme und Bedrohungen angepasst. Auch großflächige Ausfälle können planvoll und mit begrenzten Auswirkungen auf kommunale Leistungen bewältigt werden."]}, {"name": "Schutz kritischer Systeme", "leitfrage": "Sind die für die Daseinsvorsorge kritischen Systeme identifiziert und durch besondere Maßnahmen geschützt (Härtung, Netzsegmentierung, eingeschränkte Zugriffe, priorisiertes Patchen)?", "stufen": ["Es besteht kein Überblick, welche Systeme für die Daseinsvorsorge kritisch sind. Schutzmaßnahmen beschränken sich auf Basismaßnahmen wie Virenschutz und Firewall.", "Einzelne kritische Systeme sind bekannt und teilweise besonders geschützt. Ein einheitlicher Maßstab für Kritikalität und Schutzbedarf fehlt.", "Kritische Systeme sind identifiziert und nach Schutzbedarf klassifiziert. Härtung, Netzsegmentierung, eingeschränkte administrative Zugriffe und priorisiertes Patchen sind festgelegt.", "Die Wirksamkeit der Schutzmaßnahmen wird regelmäßig überprüft (z. B. Konfigurationsprüfungen, Penetrationstests) und über Kennzahlen gesteuert. Abweichungen werden nachverfolgt.", "Schutzmaßnahmen werden fortlaufend an die Bedrohungslage angepasst. Neue Systeme werden von Beginn an nach definierten Sicherheitsanforderungen eingeführt (Security by Design)."]}, {"name": "Identity & Netzwerk", "leitfrage": "Sind alle administrativen und externen Zugänge durch Multi-Faktor-Authentifizierung geschützt, und werden Berechtigungen regelmäßig überprüft (keine geteilten oder verwaisten Konten)?", "stufen": ["Berechtigungen sind gewachsen und nicht dokumentiert, geteilte oder verwaiste Konten sind verbreitet. Administrative und externe Zugänge sind allein durch Passwörter geschützt.", "Erste Regelungen zur Berechtigungsvergabe bestehen, MFA ist für einzelne Zugänge eingeführt. Überprüfungen erfolgen anlassbezogen.", "Vergabe und Entzug von Berechtigungen sind geregelt (Rollenkonzept, Ein- und Austrittsprozess). Alle administrativen und externen Zugänge sind durch MFA geschützt, das Netz ist segmentiert.", "Berechtigungen werden regelmäßig rezertifiziert und ausgewertet, privilegierte Zugänge werden gesondert überwacht. Abweichungen werden systematisch abgestellt.", "Zugriffe werden nach dem Least-Privilege-Prinzip laufend optimiert. Identitäts- und Netzarchitektur werden kontinuierlich weiterentwickelt (z. B. Zero-Trust-Ansätze)."]}, {"name": "Cloud-Nutzung", "leitfrage": "Sind für alle genutzten Cloud-Dienste Sicherheitsanforderungen (Zugriffskontrolle, Verschlüsselung, Protokollierung, Datenstandort) definiert, vertraglich vereinbart und wird deren Einhaltung überprüft? [Anm.: Frage im Original unvollständig – „Liegen die Datenzentren …“]", "stufen": ["Cloud-Dienste werden ohne einheitliche Sicherheitsanforderungen genutzt, teilweise ohne Kenntnis der IT (Schatten-IT). Datenstandort und Zugriffsmöglichkeiten Dritter sind unklar.", "Die genutzten Cloud-Dienste sind weitgehend bekannt. Erste Anforderungen wie Verschlüsselung und Zugangsschutz bestehen, sind aber nicht durchgängig geregelt oder überprüft.", "Für Cloud-Dienste sind Sicherheitsanforderungen (Zugriffskontrolle, Verschlüsselung, Protokollierung, Datenstandort) definiert und vertraglich vereinbart. Eine Freigabe vor Nutzung ist geregelt.", "Die Einhaltung wird regelmäßig anhand von Nachweisen und Berichten überprüft. Cloud-Dienste sind in Angriffserkennung und Notfallplanung einbezogen.", "Cloud-Sicherheit wird laufend an neue Dienste und Bedrohungen angepasst. Anforderungen werden bereits bei Auswahl und Beschaffung wirksam durchgesetzt."]}, {"name": "Hardware (Prozessoren etc.)", "leitfrage": "Werden eingesetzte Hardware-Komponenten (Server, Netzwerktechnik, Endgeräte) über ihren Lebenszyklus verwaltet, mit Firmware-Updates versorgt und vor Ablauf des Herstellersupports ersetzt? (Vorschlag: Verschiebung zu Digitaler Souveränität, s. Schritt 1)", "stufen": ["Es besteht kein vollständiger Überblick über die eingesetzte Hardware. Firmware-Updates und das Ende des Herstellersupports werden nicht verfolgt.", "Ein Inventar besteht in Teilen. Firmware-Updates erfolgen anlassbezogen, Geräte ohne Herstellersupport sind teilweise im Einsatz.", "Ein vollständiges Inventar mit Lebenszyklus- und Supportdaten liegt vor. Firmware-Updates und die Ersatzbeschaffung vor Supportende sind geregelt.", "Lebenszyklus und Firmware-Stände werden überwacht und über Kennzahlen gesteuert. Sicherheitsanforderungen werden bei der Beschaffung geprüft.", "Der Hardware-Lebenszyklus wird vorausschauend geplant. Vertrauenswürdigkeit und Sicherheitsmerkmale (z. B. Secure Boot, Update-Fähigkeit, Krypto-Agilität) sind feste Beschaffungskriterien."]}, {"name": "Provider-Management", "leitfrage": "Sind Sicherheitsanforderungen sowie Melde- und Unterstützungspflichten im Angriffsfall (Reaktionszeiten, Forensik, Wiederanlauf) vertraglich mit den IT-Dienstleistern geregelt und werden sie überprüft?", "stufen": ["Sicherheitsanforderungen an IT-Dienstleister sind nicht geregelt. Melde- und Unterstützungspflichten im Angriffsfall sind unklar.", "Verträge enthalten einzelne Sicherheitsregelungen, Ansprechpartner sind bekannt. Reaktionszeiten und Pflichten im Angriffsfall sind jedoch nicht verbindlich vereinbart.", "Sicherheitsanforderungen sowie Melde- und Unterstützungspflichten (Reaktionszeiten, Forensik, Wiederanlauf) sind vertraglich geregelt. Zuständigkeiten sind auf beiden Seiten benannt.", "Die Einhaltung wird regelmäßig überprüft (Berichte, Reviews, gemeinsame Übungen). Dienstleister sind in Notfallplanung und Meldewege eingebunden.", "Die Zusammenarbeit wird kontinuierlich weiterentwickelt. Anforderungen werden bei Ausschreibungen und Vertragsverlängerungen fortgeschrieben, Abhängigkeiten aktiv gesteuert."]}, {"name": "Schwachstellen- & Patch-Management", "leitfrage": "Gibt es einen definierten Prozess, mit dem bekannt gewordene Schwachstellen bewertet und innerhalb festgelegter Fristen geschlossen werden?", "stufen": ["Updates werden unregelmäßig und ohne definierte Fristen eingespielt. Schwachstellenmeldungen werden nicht systematisch verfolgt.", "Updates erfolgen für zentrale Systeme regelmäßig, jedoch ohne verbindliche Fristen und ohne Priorisierung nach Kritikalität.", "Ein Prozess mit Bewertung, Priorisierung und verbindlichen Fristen je Kritikalität besteht. Verantwortlichkeiten sind geregelt und die Systeme vollständig erfasst.", "Umsetzungsgrad und Fristeinhaltung werden gemessen und berichtet. Schwachstellenscans erfolgen regelmäßig, Ausnahmen werden dokumentiert und risikobewertet.", "Das Schwachstellenmanagement erfasst auch Dienstleister- und Cloud-Komponenten und wird anhand von Lage und Kennzahlen laufend optimiert."]}, {"name": "Kryptographie & Post-Quantum-Readiness (PQC)", "leitfrage": "Ist bekannt, welche kryptographischen Verfahren in den zentralen Systemen und Fachverfahren eingesetzt werden (Krypto-Inventar), und werden bei Beschaffung und Vertragsverlängerung Anforderungen an Krypto-Agilität bzw. quantensichere Verfahren gestellt?", "stufen": ["Es besteht kein Überblick über die eingesetzten kryptographischen Verfahren. Die Bedrohung durch Quantencomputer ist kein Thema, Beschaffungen enthalten keine Krypto-Anforderungen.", "Das Thema ist einzelnen Personen bekannt. Für einzelne Systeme (z. B. TLS-Zertifikate, VPN) besteht ein Teilüberblick, eine Zuständigkeit und ein Vorgehen fehlen jedoch.", "Ein Krypto-Inventar der zentralen Systeme und Fachverfahren liegt vor, die Zuständigkeit ist benannt. Langfristig schutzbedürftige Daten sind identifiziert, Anforderungen an Krypto-Agilität sind in Beschaffungsvorgaben verankert.", "Ein priorisierter Migrationsfahrplan mit Zeitzielen und Ressourcen besteht. Die Umstellung auf quantensichere bzw. hybride Verfahren hat bei besonders schutzbedürftigen Anwendungen begonnen, Dienstleister sind vertraglich eingebunden und der Fortschritt wird berichtet.", "Krypto-Agilität ist etabliert, Verfahren können ohne Systemwechsel ausgetauscht werden. Die Migration wird planmäßig umgesetzt und laufend an die Vorgaben von BSI und NIST angepasst, Neubeschaffungen sind durchgängig quantensicher."]}]}, {"id": "org-resilienz", "num": "02", "title": "Organisatorische Resilienz", "desc": "Fähigkeit, auch unter digitalen Störungen handlungsfähig zu bleiben.", "aspects": [{"name": "Krisenführung", "leitfrage": "Inwieweit ist unsere Kommune in der Lage, digitale Krisen strukturiert zu führen und auch unter Unsicherheit zeitnah fundierte Entscheidungen zu treffen?", "stufen": ["Digitale Krisen werden überwiegend ad hoc bewältigt. Verantwortlichkeiten und Entscheidungswege sind nicht eindeutig festgelegt und hängen stark von einzelnen Personen ab.", "Erste Rollen, Verantwortlichkeiten und Eskalationswege für digitale Krisen sind definiert. Entscheidungen erfolgen strukturierter, werden jedoch noch nicht organisationsweit einheitlich getroffen.", "Krisenorganisation, Rollen und Entscheidungsprozesse sind organisationsweit festgelegt und bekannt. Digitale Krisen können strukturiert geführt werden, auch wenn die praktische Anwendung noch begrenzt erprobt ist.", "Die Krisenorganisation wird regelmäßig geübt und überprüft. Entscheidungen erfolgen auf Grundlage definierter Prozesse und eines gemeinsamen Lagebilds. Erfahrungen aus Übungen und Vorfällen fließen in die Weiterentwicklung ein.", "Die Kommune verfügt über eine belastbare und adaptive Krisenführung. Entscheidungsprozesse werden kontinuierlich weiterentwickelt, an neue Bedrohungslagen angepasst und auch unter hoher Unsicherheit sicher angewendet."]}, {"name": "Kontinuität kommunaler Leistungen", "leitfrage": "Inwieweit ist unsere Kommune in der Lage, ihre kritischen Verwaltungsleistungen auch bei erheblichen digitalen Störungen aufrechtzuerhalten oder innerhalb angemessener Zeit wiederherzustellen?", "stufen": ["Bei digitalen Störungen kommt es zu erheblichen Einschränkungen kommunaler Leistungen. Ersatzverfahren oder Priorisierungen bestehen kaum oder nur informell.", "Kritische Leistungen sind teilweise identifiziert. Für einzelne Bereiche bestehen Notfall- oder Ersatzverfahren, deren Anwendung jedoch nicht einheitlich geregelt ist.", "Kritische Verwaltungsleistungen sind organisationsweit identifiziert und priorisiert. Für wesentliche Leistungen bestehen definierte Verfahren zur Aufrechterhaltung oder Wiederherstellung.", "Die Aufrechterhaltung kritischer Leistungen wird regelmäßig überprüft und geübt. Wiederanlaufverfahren werden bewertet und bei Bedarf angepasst.", "Die Kommune entwickelt ihre Kontinuitätsfähigkeit kontinuierlich weiter. Verfahren werden anhand neuer Risiken und Erfahrungen optimiert, sodass auch komplexe digitale Störungen mit begrenzten Auswirkungen auf die Leistungserbringung bewältigt werden können."]}, {"name": "Personelle Resilienz", "leitfrage": "Inwieweit ist unsere Kommune personell so aufgestellt, dass sie auch bei Ausfällen oder außergewöhnlichen Belastungen handlungsfähig bleibt?", "stufen": ["Die Handlungsfähigkeit hängt stark von einzelnen Schlüsselpersonen ab. Vertretungen und Wissenstransfer sind nur eingeschränkt vorhanden.", "Für zentrale Aufgaben bestehen erste Vertretungsregelungen. Kritisches Wissen wird teilweise dokumentiert, bleibt jedoch in wesentlichen Bereichen personenabhängig.", "Vertretungsregelungen, Schlüsselrollen und Wissensmanagement sind organisationsweit geregelt. Personalressourcen werden im Krisenfall planvoll eingesetzt.", "Die personelle Handlungsfähigkeit wird regelmäßig überprüft. Personalengpässe werden frühzeitig erkannt und durch interne oder externe Ressourcen abgefedert.", "Die Kommune entwickelt ihre personelle Resilienz kontinuierlich weiter. Kompetenzen werden gezielt aufgebaut, Wissen systematisch gesichert und personelle Risiken vorausschauend gesteuert."]}, {"name": "Organisationslernen & Befähigung", "leitfrage": "Inwieweit entwickelt unsere Kommune die Fähigkeiten ihrer Mitarbeitenden und ihrer Organisation systematisch weiter, um auf digitale Krisen vorbereitet zu sein und aus Erfahrungen zu lernen?", "stufen": ["Schulungen, Übungen oder strukturierte Auswertungen finden kaum statt. Lernen erfolgt überwiegend anlassbezogen und informell.", "Erste Schulungs- und Sensibilisierungsmaßnahmen sowie einzelne Übungen werden durchgeführt. Erkenntnisse werden jedoch nur teilweise dokumentiert oder umgesetzt.", "Schulungen, Übungen und Nachbereitungen erfolgen nach definierten Standards. Erkenntnisse werden dokumentiert und fließen in die Weiterentwicklung organisatorischer Abläufe ein.", "Die Wirksamkeit von Schulungen und Übungen wird regelmäßig überprüft. Verbesserungsmaßnahmen werden systematisch verfolgt und organisationsweit umgesetzt.", "Organisationslernen ist fester Bestandteil der Verwaltungskultur. Neue Erkenntnisse aus Vorfällen, Übungen und externen Entwicklungen werden kontinuierlich genutzt, um Fähigkeiten und Prozesse weiterzuentwickeln."]}, {"name": "Koordination & Zusammenarbeit", "leitfrage": "Inwieweit ist unsere Kommune in der Lage, interne und externe Akteure in digitalen Krisen wirksam zu koordinieren und zielgerichtet zusammenarbeiten zu lassen?", "stufen": ["Zusammenarbeit erfolgt überwiegend anlassbezogen und personenbezogen. Zuständigkeiten und Abstimmungswege sind nicht eindeutig geregelt.", "Erste Abstimmungs- und Kommunikationsstrukturen mit internen und externen Akteuren bestehen. Die Zusammenarbeit ist jedoch noch nicht durchgängig abgestimmt.", "Rollen, Verantwortlichkeiten sowie interne und externe Kooperationsprozesse sind definiert. Die Zusammenarbeit erfolgt strukturiert und nachvollziehbar.", "Die Zusammenarbeit mit relevanten internen und externen Partnern wird regelmäßig geübt und überprüft. Gemeinsame Lagebilder und abgestimmte Kommunikationswege unterstützen die Krisenbewältigung.", "Die Kommune ist eng in regionale und überregionale Unterstützungsstrukturen eingebunden. Kooperationen werden kontinuierlich weiterentwickelt und ermöglichen eine schnelle, koordinierte Bewältigung digitaler Krisen."]}]}, {"id": "dig-souveraenitaet", "num": "03", "title": "Digitale Souveränität", "desc": "Fähigkeit, unabhängig von kritischen externen Akteuren handlungsfähig zu bleiben.", "aspects": [{"name": "Datenhoheit", "leitfrage": "Weiß die Kommune für jedes zentrale IT-Fachverfahren, wo die Daten physisch gespeichert werden und welchem Recht der Anbieter unterliegt?", "stufen": ["Speicherort und Rechtsraum der Fachverfahren sind bestenfalls einzelnen Personen bekannt, aber nicht dokumentiert.", "Für einzelne, besonders sensible Fachverfahren wurden Speicherort und Rechtsraum erhoben; vollständige Übersicht fehlt noch.", "Organisationsweite Übersicht mit Speicherort und Rechtsraum je Fachverfahren existiert und wird bei Neubeschaffungen geprüft, aber nicht regelmäßig aktualisiert.", "Übersicht wird regelmäßig überprüft und bei Vertragsänderungen automatisch aktualisiert; Verantwortlichkeiten sind klar zugeordnet.", "Kommune steuert aktiv, in welchen Rechtsräumen sensible Daten verarbeitet werden dürfen, und passt dies laufend an neue Entwicklungen an."]}, {"name": "Lieferketten-Sicherheit / -Abhängigkeit", "leitfrage": "Ist für jedes IT-System mit Bedeutung für die Daseinsvorsorge bekannt, welche Zulieferer/Subunternehmer an dessen Herstellung, Integration oder Wartung beteiligt sind? Existiert für kritische Komponenten ein Zweitanbieter?", "stufen": ["Nur der direkte Vertragspartner ist bekannt, Zulieferer/Subunternehmer nicht; Ausfälle werden erst bei Eintritt bemerkt.", "Für wichtige Systeme der Daseinsvorsorge wurden erstmals Zulieferer erfasst; systematische Risikobewertung fehlt noch.", "Organisationsweiter Prozess zur Erfassung/Bewertung von Zulieferern existiert; einzelne Zweitanbieter dokumentiert, flächendeckende Redundanz fehlt.", "Lieferketten werden regelmäßig überprüft und bei Vertragsverlängerungen systematisch berücksichtigt; aktuelle Übersicht für alle relevanten Systeme.", "Kontinuierlich aktualisierte Lieferketten-Transparenz; Second-Source-Lösungen für alle kritischen Systeme aktiv etabliert und getestet."]}, {"name": "Plattformabhängigkeiten", "leitfrage": "Kann die Kommune für jedes IT-System mit Bedeutung für die Daseinsvorsorge innerhalb von 12 Monaten den Betreiber/Anbieter wechseln, ohne den Betrieb zu gefährden?", "stufen": ["Ein Anbieterwechsel wurde nie geprüft oder simuliert; Aufwand ist unbekannt.", "Für einzelne kritische Systeme wurde grob abgeschätzt, wie schwer ein Wechsel wäre; strukturierte Analyse fehlt.", "Dokumentierte Einschätzung zur Wechselfähigkeit für alle Systeme der Daseinsvorsorge liegt vor; praktische Erprobung fehlt noch.", "Exit-Strategien werden regelmäßig überprüft und aktiv in Vertragsverhandlungen genutzt; einzelne Wechsel testweise durchgeführt.", "Bewusste Multi-Provider- oder Open-Standard-Strategie; Anbieterwechsel sind organisatorisch eingeübt, kein Ausnahmefall mehr."]}, {"name": "Schlüsseltechnologien", "leitfrage": "Verfügt die Kommune über eigenes Personal oder einen Dienstleister, der die zentralen IT-Kernsysteme im Ernstfall eigenständig betreiben und wiederherstellen kann?", "stufen": ["Zentrale Systeme laufen vollständig über externe Dienstleister; kein eigenes Personal für Notbetrieb; keine Definition von „schlüsselrelevant“.", "Erste kritische Technologien identifiziert; punktuelles internes Wissen vorhanden, eigenständiger Notbetrieb noch nicht möglich.", "Schlüsselrelevante Technologien sind festgelegt, dokumentierte Mindestkompetenzen bestehen; praktische Erprobung fehlt flächendeckend.", "Vertraglich oder personell abgesicherte Betriebsfähigkeiten für alle Schlüsseltechnologien; regelmäßige Überprüfung, Betriebsübernahme-Klauseln in Verträgen.", "Belastbare eigene/vertraglich gesicherte Fähigkeiten zur Fortführung aller Schlüsseltechnologien bei Partnerausfall; kontinuierliche Weiterentwicklung."]}, {"name": "Know-how & Kompetenzen", "leitfrage": "Gibt es für jedes kritische IT-System mindestens eine benannte Person in der Verwaltung, die dessen Funktionsweise und Abhängigkeiten versteht (nicht nur der externe Dienstleister)?", "stufen": ["Wissen liegt fast ausschließlich beim externen Dienstleister; keine benannten internen Ansprechpersonen.", "Erste interne Ansprechpersonen für wichtige Systeme benannt; systematischer Kompetenzaufbau fehlt noch.", "Benannte Verantwortliche mit Grundverständnis für alle Systeme der Daseinsvorsorge; Weiterbildungskonzept etabliert, aber nicht vollständig umgesetzt.", "Kompetenzen werden regelmäßig erhoben, gezielt gefördert und in Personalentwicklung/Nachfolgeplanung berücksichtigt; Wissen ist dokumentiert und übertragbar.", "Breit verteilte, kontinuierlich weiterentwickelte digitale Kompetenzbasis; fester Bestandteil strategischer Personalplanung."]}, {"name": "Vertrauenswürdigkeit", "leitfrage": "Wurden die eingesetzten IT-Hersteller/-Produkte hinsichtlich Herkunft, Zertifizierung und Quellcode-Transparenz geprüft, bevor sie beschafft wurden?", "stufen": ["Herkunft, Zertifizierung, Quellcode-Transparenz werden bei Beschaffung nicht systematisch geprüft.", "Für einzelne sicherheitsrelevante Beschaffungen wurden erstmals Herkunfts-/Zertifizierungsfragen gestellt; einheitliche Methodik fehlt.", "Dokumentierte Prüf-Checkliste existiert und wird bei relevanten Beschaffungen angewendet; durchgängige Anwendung noch nicht gesichert.", "Vertrauenswürdigkeitsprüfungen sind fester, verbindlicher Bestandteil aller relevanten Vergabeverfahren; Ergebnisse fließen in Lieferantenbewertungen ein.", "Etabliertes, kontinuierlich weiterentwickeltes System zur Bewertung/Überwachung der Vertrauenswürdigkeit; proaktive Anpassung an neue Bedrohungslagen."]}, {"name": "Redundanz", "leitfrage": "Existiert für die drei wichtigsten digitalen Kernprozesse (z. B. Meldewesen, Sozialleistungen, Zahlungsverkehr) ein funktionierender Notbetrieb ohne den Hauptanbieter?", "stufen": ["Kein funktionierender Notbetrieb ohne Hauptanbieter für zentrale Kernprozesse; Ausfälle führen zum Stillstand.", "Erste Notfallüberlegungen für einzelne kritische Prozesse, aber ungetestet; systematischer Überblick fehlt.", "Dokumentierte Notfallpläne mit Alternativlösung für wichtigste Kernprozesse der Daseinsvorsorge; noch nicht praktisch erprobt.", "Notfallpläne werden regelmäßig getestet und aktualisiert; Testergebnisse fließen in Weiterentwicklung ein; Verantwortlichkeiten klar zugeordnet.", "Belastbare, regelmäßig geübte Redundanzlösungen für alle Kernprozesse; kontinuierliche Anpassung an neue Bedrohungslagen; Notbetrieb ist Routine."]}]}, {"id": "info-ki-resilienz", "num": "04", "title": "Informations- & KI-Resilienz", "desc": "Fähigkeit, Manipulationen im Informationsraum zu erkennen und vertrauenswürdig mit KI umzugehen.", "aspects": [{"name": "Lagebild & Erkennung von Desinformation", "leitfrage": "Inwieweit ist unsere Kommune in der Lage, Desinformation und manipulierte Inhalte (z. B. Deepfakes), die sie oder ihre Amtsträger betreffen, frühzeitig zu erkennen und richtig einzuordnen?", "stufen": ["Desinformation wird nur zufällig oder durch Hinweise Dritter wahrgenommen. Zuständigkeiten und Meldewege existieren nicht.", "Einzelne Stellen (z. B. Pressestelle) beobachten anlassbezogen soziale Medien. Erkenntnisse werden nicht systematisch dokumentiert oder geteilt.", "Beobachtung, Meldewege und Bewertungskriterien sind definiert; relevante Kanäle werden regelmäßig beobachtet. Die Anbindung an Landes- und Bundesstellen ist geregelt.", "Ein Lagebild zum Informationsraum wird regelmäßig erstellt und mit anderen Behörden geteilt. Die Wirksamkeit der Erkennung wird überprüft; Werkzeuge (z. B. Monitoring, Deepfake-Erkennung) werden gezielt eingesetzt.", "Die Kommune antizipiert Manipulationskampagnen (z. B. vor Wahlen oder Großlagen), passt ihr Monitoring kontinuierlich an neue Techniken an und wirkt aktiv in überregionalen Netzwerken mit."]}, {"name": "Krisen- & Risikokommunikation", "leitfrage": "Inwieweit kann unsere Kommune im Krisenfall schnell, abgestimmt und über als vertrauenswürdig etablierte Kanäle kommunizieren und Falschinformationen aktiv entgegentreten (Prebunking/Debunking)?", "stufen": ["Kommunikation erfolgt reaktiv und unkoordiniert. Im Krisenfall entstehen Informationslücken, die Gerüchten und Desinformation Raum geben.", "Erste Zuständigkeiten und Kanäle sind benannt. Vorbereitete Inhalte und abgestimmte Sprachregelungen fehlen jedoch weitgehend.", "Ein Krisenkommunikationskonzept mit Rollen, Freigaben und Kanälen liegt vor; Zielgruppen und Formate sind definiert. Prebunking- und Debunking-Ansätze sind bekannt und vorbereitet.", "Krisenkommunikation wird regelmäßig geübt (auch gemeinsam mit dem Krisenstab). Reichweite und Vertrauenswürdigkeit der Kanäle werden gemessen; Falschinformationen wird schnell und koordiniert begegnet.", "Die Kommune kommuniziert auch unter hohem Druck schnell, transparent und wirksam. Erkenntnisse aus Einsätzen, Forschung und Netzwerken fließen kontinuierlich in die Weiterentwicklung ein."]}, {"name": "Integrität & Authentizität eigener Informationen", "leitfrage": "Inwieweit sind die offiziellen Informationskanäle und amtlichen Inhalte unserer Kommune gegen Manipulation und Missbrauch geschützt und für Bürgerinnen und Bürger eindeutig als echt erkennbar?", "stufen": ["Eigene Kanäle sind nur grundlegend geschützt. Gefälschte Auftritte oder Schreiben würden erst spät bemerkt.", "Wichtige Konten sind gesichert (z. B. Zwei-Faktor-Authentisierung, Verifizierung); ein Überblick über alle offiziellen Kanäle entsteht. Der Umgang mit Fälschungen ist nicht geregelt.", "Alle offiziellen Kanäle sind inventarisiert, geschützt und gekennzeichnet. Verfahren für den Umgang mit Fake-Accounts und gefälschten Inhalten sind definiert.", "Schutz und Authentizität werden regelmäßig überprüft. Herkunfts- und Echtheitsnachweise (z. B. Content Credentials/C2PA) werden für kritische Inhalte genutzt; Take-down-Prozesse mit Plattformen sind etabliert.", "Die Kommune setzt Maßstäbe für authentische Verwaltungskommunikation, entwickelt Schutzmaßnahmen proaktiv weiter und gilt als verlässliche, verifizierbare Quelle im Informationsraum."]}, {"name": "Vertrauenswürdiger KI-Einsatz (KI-Governance)", "leitfrage": "Inwieweit verfügt unsere Kommune über verbindliche Regeln, Zuständigkeiten und Prüfprozesse für den Einsatz von KI-Systemen (z. B. Risikobewertung, menschliche Aufsicht, Transparenz nach EU AI Act)?", "stufen": ["KI wird vereinzelt und ungeregelt genutzt („Schatten-KI“). Risiken, Zuständigkeiten und der Rechtsrahmen sind weitgehend unbekannt.", "Erste Regeln (z. B. Dienstanweisung zu generativer KI) und ein grober Überblick über genutzte KI-Anwendungen existieren. Risikobewertungen erfolgen nur punktuell.", "KI-Richtlinie, Risikoklassifizierung (inkl. Prüfung nach EU AI Act), KI-Inventar und menschliche Aufsicht sind verbindlich geregelt. Transparenzpflichten (Art. 50 KI-VO) werden umgesetzt.", "KI-Einsätze werden systematisch überwacht und auditiert (z. B. in Anlehnung an ISO/IEC 42001 oder NIST AI RMF). Qualität und Wirksamkeit werden gemessen; Vorfälle werden ausgewertet.", "Die Kommune steuert ihren KI-Einsatz vorausschauend, bewertet neue KI-Risiken (z. B. agentische Systeme) frühzeitig und entwickelt ihre KI-Governance kontinuierlich weiter."]}, {"name": "Medien- & KI-Kompetenz", "leitfrage": "Inwieweit werden Mitarbeitende und Führungskräfte systematisch befähigt, Desinformation und KI-generierte Inhalte zu erkennen und KI-Werkzeuge kompetent und regelkonform zu nutzen?", "stufen": ["Kompetenzen hängen von der Eigeninitiative Einzelner ab. Schulungen zu Desinformation oder KI finden kaum statt.", "Einzelne Sensibilisierungsmaßnahmen (z. B. Awareness zu Phishing und Deepfakes) werden durchgeführt, jedoch ohne Zielgruppenbezug und Regelmäßigkeit.", "Ein Schulungsprogramm für Medien- und KI-Kompetenz (inkl. Pflichten nach Art. 4 KI-VO) ist definiert und erreicht relevante Zielgruppen einschließlich Führung und Krisenstab.", "Die Wirksamkeit der Befähigung wird überprüft (z. B. Übungen mit simulierten Deepfake-/Desinformationslagen). Ergebnisse steuern die Weiterentwicklung der Angebote.", "Lernen ist verstetigt. Die Kommune befähigt auch die Stadtgesellschaft (z. B. gemeinsam mit Schulen, VHS, Medienanstalten) und passt Inhalte laufend an neue Manipulationstechniken an."]}]}, {"id": "governance-strategie", "num": "05", "title": "Governance & Strategie", "desc": "Fähigkeit, Digital Defense strategisch zu verankern, zu steuern und mit Ressourcen zu hinterlegen.", "aspects": [{"name": "Strategie & Zielbild", "leitfrage": "Inwieweit verfügt unsere Kommune über eine von der Verwaltungsspitze beschlossene Strategie bzw. Leitlinie für Informationssicherheit und Digital Defense mit konkreten Zielen und einer Umsetzungs-Roadmap?", "stufen": ["Es existiert keine dokumentierte Strategie. Sicherheit wird als reines IT-Thema behandelt; Maßnahmen erfolgen anlassbezogen.", "Eine Leitlinie oder Teilstrategien existieren als Entwurf oder für Einzelbereiche. Ein verbindliches Zielbild und eine Roadmap fehlen.", "Eine von der Verwaltungsspitze beschlossene Strategie mit Zielen, Geltungsbereich und Roadmap liegt vor und ist in der Organisation bekannt.", "Die Strategieumsetzung wird über Kennzahlen und Meilensteine verfolgt. Die Strategie wird regelmäßig überprüft und an Bedrohungs- und Rechtslage angepasst.", "Die Strategie wird vorausschauend weiterentwickelt (neue Technologien, Bedrohungen, Regulatorik) und ist mit Landes-/Bundesinitiativen sowie interkommunalen Strategien verzahnt."]}, {"name": "Führungsverankerung, Rollen & Verantwortlichkeiten", "leitfrage": "Inwieweit ist die Verantwortung für Digital Defense auf Leitungsebene verankert und sind Rollen wie ISB verbindlich benannt, mit Mandat und Ressourcen ausgestattet?", "stufen": ["Verantwortung ist nicht geregelt und liegt de facto bei der IT. Die Verwaltungsspitze befasst sich nur im Schadensfall mit dem Thema.", "Ein/e Informationssicherheitsbeauftragte/r ist benannt (oft in Personalunion), jedoch mit unklarem Mandat und begrenzten Ressourcen. Berichtswege sind informell.", "Rollen, Mandate, Vertretungen und Gremien (z. B. ISMS-Lenkungskreis) sind schriftlich geregelt. Die Verwaltungsspitze nimmt ihre Gesamtverantwortung aktiv wahr.", "Die Leitungsebene steuert über regelmäßige Berichte und Entscheidungen. Die Zusammenarbeit mit IT-Dienstleistern und interkommunalen Strukturen ist vertraglich und organisatorisch klar geregelt.", "Sicherheitskultur wird von der Führung vorgelebt. Governance-Strukturen werden kontinuierlich optimiert und dienen anderen Kommunen als Referenz."]}, {"name": "Risikomanagement", "leitfrage": "Inwieweit werden digitale Risiken (einschließlich Dienstleister- und Lieferkettenrisiken) systematisch identifiziert, bewertet, behandelt und regelmäßig an die Verwaltungsspitze berichtet?", "stufen": ["Risiken werden nicht systematisch erfasst. Entscheidungen beruhen auf Einzelmeinungen und Anlassfällen.", "Für einzelne Verfahren oder Projekte werden Risiken betrachtet. Eine einheitliche Methodik und ein Gesamtüberblick fehlen.", "Eine verbindliche Methodik (z. B. nach BSI-Standard 200-3) ist eingeführt. Kritische Verfahren, Dienstleisterabhängigkeiten und Maßnahmen sind in einem Risikoregister dokumentiert.", "Risiken werden regelmäßig neu bewertet, Maßnahmen nachverfolgt und an die Leitung berichtet. Risikoakzeptanz wird bewusst und dokumentiert entschieden.", "Das Risikomanagement ist vorausschauend und in alle wesentlichen Entscheidungen (Beschaffung, Projekte, Haushalt) integriert. Neue Risikofelder (z. B. KI, Lieferketten) werden frühzeitig aufgenommen."]}, {"name": "Compliance & Rechtsrahmen", "leitfrage": "Inwieweit kennt unsere Kommune die für sie geltenden rechtlichen und normativen Anforderungen (z. B. Landes-ISMS-Vorgaben, IT-Grundschutz/WiBA, DSGVO, EU AI Act) und setzt sie nachweisbar um?", "stufen": ["Rechtliche und normative Anforderungen sind kaum bekannt. Die Umsetzung erfolgt punktuell (z. B. nur Datenschutz).", "Wesentliche Anforderungen sind identifiziert. Die Umsetzung erfolgt jedoch unkoordiniert und ohne systematische Nachweisführung.", "Ein Überblick über geltende Anforderungen (Landesrecht, IT-Grundschutz/WiBA*, DSGVO, EU AI Act) besteht. Umsetzung und Nachweise sind organisiert (z. B. über WiBA-Checklisten). *BSI: „Weg in die Basis-Absicherung“", "Compliance wird regelmäßig überprüft (interne/externe Audits). Abweichungen werden systematisch behoben; regulatorische Änderungen werden aktiv verfolgt.", "Die Kommune erfüllt anerkannte Standards nachweisbar (z. B. IT-Grundschutz-Profil „Basis-Absicherung Kommunalverwaltung“ oder ISO/IEC 27001), antizipiert regulatorische Entwicklungen und bringt Erfahrungen in kommunale Spitzenverbände ein."]}, {"name": "Ressourcen & Steuerung", "leitfrage": "Inwieweit sind Budget und Personal für Digital Defense bedarfsgerecht hinterlegt und wird die Wirksamkeit der Maßnahmen regelmäßig gemessen und gesteuert (z. B. über Kennzahlen, Audits, Reifegradbewertungen)?", "stufen": ["Es gibt kein ausgewiesenes Sicherheitsbudget. Investitionen erfolgen reaktiv nach Vorfällen.", "Mittel werden projektbezogen bereitgestellt. Personalkapazitäten sind knapp und nicht langfristig gesichert.", "Ein dediziertes Budget und definierte Personalressourcen (ggf. interkommunal geteilt) sind im Haushalt verankert. Prioritäten folgen der Risikolage.", "Der Mitteleinsatz wird über Kennzahlen und Reifegradmessungen gesteuert. Die Wirksamkeit von Investitionen wird bewertet und an Verwaltungsspitze und Rat berichtet.", "Die Ressourcensteuerung ist vorausschauend und lageabhängig. Die Kommune investiert kontinuierlich in Verbesserung und nutzt Synergien durch Kooperationen und zentrale Angebote von Land und Bund."]}]}]</script>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('dd-data').textContent);
  var STORE_KEY = 'dd-reifegradkompass-v1';
  var STUFEN_NAMEN = ['Initial','Entwickelt','Definiert','Gemanagt','Optimierend'];

  var state = loadState() || {
    view: 'intro',
    dimIndex: 0,
    scores: {},   // "dimId::aspectIdx" -> 1-5
    touched: {}   // "dimId::aspectIdx" -> true
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.scores) return null;
      return parsed;
    }catch(e){ return null; }
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function resetState(){
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    state = { view:'intro', dimIndex:0, scores:{}, touched:{} };
    render();
  }

  function key(dimId, idx){ return dimId + '::' + idx; }

  function totalAspects(){
    return DATA.reduce(function(sum,d){ return sum + d.aspects.length; }, 0);
  }
  function touchedCount(){
    return Object.keys(state.touched).filter(function(k){ return state.touched[k]; }).length;
  }
  function dimTouchedCount(dim){
    var c = 0;
    dim.aspects.forEach(function(a,i){ if(state.touched[key(dim.id,i)]) c++; });
    return c;
  }
  function dimAverage(dim){
    var vals = [];
    dim.aspects.forEach(function(a,i){
      var k = key(dim.id,i);
      if(state.touched[k]) vals.push(state.scores[k] || 3);
    });
    if(!vals.length) return null;
    return vals.reduce(function(a,b){return a+b;},0) / vals.length;
  }
  function overallAverage(){
    var vals = [];
    DATA.forEach(function(dim){
      dim.aspects.forEach(function(a,i){
        var k = key(dim.id,i);
        if(state.touched[k]) vals.push(state.scores[k] || 3);
      });
    });
    if(!vals.length) return null;
    return vals.reduce(function(a,b){return a+b;},0) / vals.length;
  }
  function statusOf(score){
    if(score === null || score === undefined) return {cls:'warn', label:'Offen'};
    if(score < 2.5) return {cls:'critical', label:'Kritisch'};
    if(score < 3.5) return {cls:'warn', label:'Im Aufbau'};
    return {cls:'good', label:'Etabliert'};
  }
  function statusColorVar(cls){
    return cls === 'good' ? 'var(--good)' : cls === 'critical' ? 'var(--critical)' : 'var(--warn)';
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Artifacts run sandboxed; window.confirm() is blocked there, so use an in-page dialog instead.
  function showConfirm(message, onConfirm){
    var overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML =
      '<div class="confirm-box">' +
        '<p>' + esc(message) + '</p>' +
        '<div class="confirm-actions">' +
          '<button class="btn btn-ghost btn-sm" data-confirm-cancel>Abbrechen</button>' +
          '<button class="btn btn-primary btn-sm" data-confirm-ok>Bestätigen</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e){ if(e.key === 'Escape') close(); }
    overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
    overlay.querySelector('[data-confirm-cancel]').onclick = close;
    overlay.querySelector('[data-confirm-ok]').onclick = function(){ close(); onConfirm(); };
    document.addEventListener('keydown', onKey);
  }

  // ============ RENDER ROOT ============
  function render(){
    var app = document.getElementById('app');
    if(state.view === 'intro') app.innerHTML = renderTopbar() + renderIntro();
    else if(state.view === 'assessment') app.innerHTML = renderTopbar() + renderAssessment();
    else app.innerHTML = renderTopbar() + renderResults();
    afterRender();
    window.scrollTo({top:0, behavior:'auto'});
  }

  function renderTopbar(){
    var tc = touchedCount(), tot = totalAspects();
    return '' +
    '<div class="topbar">' +
      '<div class="brand">' +
        '<div class="brand-mark"></div>' +
        '<div class="brand-text">Digital Defense Reifegradkompass<small>Selbstbewertung f&uuml;r Kommunen</small></div>' +
      '</div>' +
      '<div class="topbar-right">' +
        (state.view!=='intro' ? '<div class="progress-pill"><span class="dot"></span><span class="mono">'+tc+' / '+tot+' bewertet</span></div>' : '') +
      '</div>' +
    '</div>';
  }

  // ============ INTRO ============
  function renderIntro(){
    var hasProgress = touchedCount() > 0;
    var dims = DATA.map(function(d,i){
      return '<div class="dim-overview-card"><div class="num">DIM '+d.num+'</div><h3>'+esc(d.title)+'</h3><p>'+esc(d.desc)+'</p></div>';
    }).join('');

    return '' +
    '<div class="shell">' +
      '<div class="hero">' +
        '<div class="hero-grid"></div>' +
        '<div class="hero-rings"></div>' +
        '<div class="hero-sweep"></div>' +
        '<div class="hero-content">' +
          '<div class="eyebrow" style="margin-bottom:14px;">Reifegradmodell &middot; Digital Defense</div>' +
          '<h1>Wie widerstandsf&auml;hig ist Ihre Kommune gegen digitale Bedrohungen?</h1>' +
          '<p class="hero-lede">Eine strukturierte Selbstbewertung entlang 5 Dimensionen der kommunalen Digital-Defense-F&auml;higkeit &ndash; von Cyber Defence bis Governance. Sch&auml;tzen Sie je Kernaspekt Ihren aktuellen Reifegrad ein und erhalten Sie ein Lagebild mit konkreten n&auml;chsten Schritten.</p>' +
          '<div class="hero-facts">' +
            '<div class="hero-fact"><div class="num tabular">5</div><div class="label">Dimensionen</div></div>' +
            '<div class="hero-fact"><div class="num tabular">'+totalAspects()+'</div><div class="label">Kernaspekte</div></div>' +
            '<div class="hero-fact"><div class="num tabular">5</div><div class="label">Reifegradstufen</div></div>' +
            '<div class="hero-fact"><div class="num tabular">~20</div><div class="label">Minuten</div></div>' +
          '</div>' +
          '<button class="btn btn-primary" id="btn-start">Bewertung starten &rarr;</button>' +
        '</div>' +
      '</div>' +
      (hasProgress ? renderResumeBanner() : '') +
      '<div class="dim-overview">'+dims+'</div>' +
      renderFooter() +
    '</div>';
  }

  function renderResumeBanner(){
    var tc = touchedCount(), tot = totalAspects();
    return '' +
    '<div class="resume-banner">' +
      '<div><p><strong>Gespeicherter Fortschritt gefunden.</strong> '+tc+' von '+tot+' Kernaspekten bereits bewertet.</p>' +
      '<p class="sub">Der Stand liegt lokal in diesem Browser &ndash; es wurden keine Daten &uuml;bertragen.</p></div>' +
      '<div class="resume-actions">' +
        '<button class="btn btn-ghost btn-sm" id="btn-reset">Neu beginnen</button>' +
        '<button class="btn btn-primary btn-sm" id="btn-resume">Fortsetzen</button>' +
      '</div>' +
    '</div>';
  }

  // ============ ASSESSMENT ============
  function renderAssessment(){
    var dim = DATA[state.dimIndex];
    var tot = totalAspects(), tc = touchedCount();
    var pct = Math.round((tc/tot)*100);

    var nav = DATA.map(function(d,i){
      var dc = dimTouchedCount(d);
      var complete = dc === d.aspects.length;
      var cls = 'dim-nav-item' + (i===state.dimIndex?' active':'') + (complete?' complete':'');
      return '<button class="'+cls+'" data-goto-dim="'+i+'">' +
        '<span class="dim-nav-num">'+(complete?'&#10003;':d.num)+'</span>' +
        '<span class="dim-nav-label">'+esc(d.title)+'</span>' +
        '<span class="dim-nav-count mono">'+dc+'/'+d.aspects.length+'</span>' +
      '</button>';
    }).join('');

    var cards = dim.aspects.map(function(a,i){
      var k = key(dim.id, i);
      var touched = !!state.touched[k];
      var score = state.scores[k] || 3;
      var stufeName = STUFEN_NAMEN[score-1];
      var fillPct = ((score-1)/4*100);
      return '' +
      '<div class="aspect-card'+(touched?' touched':'')+'" data-aspect="'+i+'">' +
        '<div class="aspect-head">' +
          '<div class="aspect-title">'+esc(a.name)+'</div>' +
          '<div class="aspect-index mono">'+dim.num+'.'+String(i+1).padStart(2,'0')+'</div>' +
        '</div>' +
        '<p class="aspect-question">'+esc(a.leitfrage)+'</p>' +
        '<div class="slider-row">' +
          '<input type="range" min="1" max="5" step="1" value="'+score+'" style="--fill:'+fillPct+'%" data-slider="'+i+'" aria-label="Reifegrad f&uuml;r '+esc(a.name)+'">' +
          '<span class="stufe-badge mono">'+(touched? 'Stufe '+score+' &middot; '+stufeName : 'Noch offen') +'</span>' +
        '</div>' +
        '<div class="scale-ticks"><span>1 &middot; Initial</span><span>2</span><span>3</span><span>4</span><span>5 &middot; Optimierend</span></div>' +
        '<div class="stufe-text" data-stufetext="'+i+'">'+esc(a.stufen[score-1])+'</div>' +
      '</div>';
    }).join('');

    var isLast = state.dimIndex === DATA.length - 1;

    return '' +
    '<div class="shell">' +
      '<div class="layout">' +
        '<div class="sidebar">' +
          '<div class="sidebar-progress">' +
            '<div class="top"><span>Gesamtfortschritt</span><span class="mono">'+pct+'%</span></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
          '</div>' +
          '<div class="dim-nav">'+nav+'</div>' +
          '<div class="sidebar-cta">' +
            '<button class="btn btn-ghost btn-sm" id="btn-results-early" style="width:100%; justify-content:center;">Zwischenstand ansehen</button>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="dim-header">' +
            '<div class="eyebrow">Dimension '+dim.num+' von 05</div>' +
            '<h2>'+esc(dim.title)+'</h2>' +
            '<p>'+esc(dim.desc)+'</p>' +
          '</div>' +
          cards +
          '<div class="assess-nav">' +
            '<button class="btn btn-ghost" id="btn-prev" '+(state.dimIndex===0?'disabled':'')+'>&larr; Zur&uuml;ck</button>' +
            '<span class="step">Dimension '+(state.dimIndex+1)+' von '+DATA.length+'</span>' +
            (isLast ?
              '<button class="btn btn-primary" id="btn-finish">Ergebnis anzeigen &rarr;</button>' :
              '<button class="btn btn-primary" id="btn-next">Weiter &rarr;</button>') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ============ RESULTS ============
  function renderResults(){
    var overall = overallAverage();
    var st = statusOf(overall);
    var tc = touchedCount(), tot = totalAspects();
    var incomplete = tc < tot;

    var dimData = DATA.map(function(d){
      var avg = dimAverage(d);
      return {dim:d, avg:avg, status: statusOf(avg)};
    });

    var scoreRows = dimData.map(function(dd){
      var pct = dd.avg ? ((dd.avg-1)/4*100) : 0;
      var color = statusColorVar(dd.status.cls);
      return '' +
      '<div class="dim-score-row" style="border-left-color:'+color+'">' +
        '<div class="rank mono">'+dd.dim.num+'</div>' +
        '<div><div class="name">'+esc(dd.dim.title)+'</div><div class="barwrap"><div class="barfill" style="width:'+pct+'%; background:'+color+'"></div></div></div>' +
        '<div class="val tabular" style="color:'+color+'">'+(dd.avg? dd.avg.toFixed(1):'&ndash;')+'</div>' +
      '</div>';
    }).join('');

    var recItems = dimData.map(function(dd){
      var color = statusColorVar(dd.status.cls);
      var gaps = dd.dim.aspects.map(function(a,i){
        var k = key(dd.dim.id,i);
        var score = state.touched[k] ? (state.scores[k]||3) : null;
        return {aspect:a, idx:i, score:score};
      }).filter(function(g){ return g.score !== null && g.score < 5; })
        .sort(function(a,b){ return a.score - b.score; })
        .slice(0,2);

      var body = gaps.length ? gaps.map(function(g){
        return '' +
        '<div class="rec-gap">' +
          '<div class="k">'+esc(g.aspect.name)+' &middot; aktuell Stufe '+g.score+'</div>' +
          '<div class="from">N&auml;chster Schritt &rarr; Stufe '+(g.score+1)+' &middot; '+STUFEN_NAMEN[g.score]+'</div>' +
          '<p>'+esc(g.aspect.stufen[g.score])+'</p>' +
        '</div>';
      }).join('') : '<div class="rec-gap"><p>Alle bewerteten Kernaspekte dieser Dimension stehen auf Stufe 5. Fokus: Weiterentwicklung und Wissenstransfer an andere Kommunen.</p></div>';

      return '' +
      '<details class="rec-item">' +
        '<summary class="rec-summary">' +
          '<span class="dot" style="background:'+color+'"></span>' +
          '<span class="title">'+esc(dd.dim.title)+'</span>' +
          '<span class="meta">'+(dd.avg? dd.avg.toFixed(1):'&ndash;')+' / 5.0</span>' +
          '<span class="chev">&#9656;</span>' +
        '</summary>' +
        '<div class="rec-body">'+body+'</div>' +
      '</details>';
    }).join('');

    return '' +
    '<div class="shell">' +
      (incomplete ? '<div class="resume-banner"><div><p><strong>Bewertung noch nicht vollst&auml;ndig.</strong> '+tc+' von '+tot+' Kernaspekten bewertet.</p><p class="sub">Das Ergebnis basiert nur auf den bereits bewerteten Kernaspekten.</p></div><div class="resume-actions"><button class="btn btn-primary btn-sm" id="btn-continue">Weiter bewerten</button></div></div>' : '') +
      '<div class="results-hero" style="margin-top:20px;">' +
        '<div>' +
          '<span class="status-badge status-'+st.cls+'"><span class="led"></span>'+st.label+'</span>' +
          '<h2>Gesamtreifegrad Digital Defense</h2>' +
          '<p class="interp">'+interpretationText(overall)+'</p>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div><span class="score-big tabular" style="color:'+statusColorVar(st.cls)+'">'+(overall?overall.toFixed(1):'&ndash;')+'</span><span class="score-of">/ 5.0</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="results-grid">' +
        '<div class="panel">' +
          '<h3>Reifegrad je Dimension</h3>' +
          '<div class="radar-wrap">'+renderRadar(dimData)+'</div>' +
          '<div class="legend">' +
            '<div class="legend-item"><span class="sw" style="background:var(--critical)"></span>Kritisch &lt; 2.5</div>' +
            '<div class="legend-item"><span class="sw" style="background:var(--warn)"></span>Im Aufbau 2.5&ndash;3.5</div>' +
            '<div class="legend-item"><span class="sw" style="background:var(--good)"></span>Etabliert &gt; 3.5</div>' +
          '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<h3>Dimensionswerte im Detail</h3>' +
          '<div class="dim-score-list">'+scoreRows+'</div>' +
        '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<h3>Handlungsempfehlungen je Dimension</h3>' +
        '<div class="rec-list">'+recItems+'</div>' +
      '</div>' +
      '<div class="results-actions">' +
        '<button class="btn btn-ghost" id="btn-back-assessment">&larr; Zur&uuml;ck zur Bewertung</button>' +
        '<button class="btn btn-ghost" id="btn-restart">Neue Bewertung starten</button>' +
      '</div>' +
      renderFooter() +
    '</div>';
  }

  function interpretationText(overall){
    if(overall === null) return 'Noch keine Bewertungen erfasst.';
    if(overall < 2.5) return 'Grundlegende F&auml;higkeiten fehlen noch in mehreren Bereichen. Priorit&auml;t sollte auf den am kritischsten bewerteten Dimensionen liegen.';
    if(overall < 3.5) return 'Wesentliche Strukturen sind angelegt, aber noch nicht durchg&auml;ngig etabliert. Die Empfehlungen unten zeigen konkrete n&auml;chste Schritte.';
    return 'Ein solides, weitgehend etabliertes Sicherheitsniveau. Fokus liegt nun auf kontinuierlicher Weiterentwicklung und Feinschliff einzelner Aspekte.';
  }

  // ============ RADAR CHART (inline SVG) ============
  function renderRadar(dimData){
    var size = 320, cx = size/2, cy = size/2, r = 118;
    var n = dimData.length;
    var levels = [1,2,3,4,5];

    function pointFor(i, value){
      var angle = (Math.PI*2 * i/n) - Math.PI/2;
      var rad = r * (value-1)/4;
      return [cx + rad*Math.cos(angle), cy + rad*Math.sin(angle)];
    }

    var gridPolys = levels.map(function(lvl){
      var pts = dimData.map(function(dd,i){ return pointFor(i,lvl).join(','); }).join(' ');
      return '<polygon points="'+pts+'" fill="none" stroke="var(--border)" stroke-width="1"/>';
    }).join('');

    var spokes = dimData.map(function(dd,i){
      var p = pointFor(i,5);
      return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--border)" stroke-width="1"/>';
    }).join('');

    var dataPts = dimData.map(function(dd,i){ return pointFor(i, dd.avg || 1); });
    var dataPolyStr = dataPts.map(function(p){ return p.join(','); }).join(' ');

    var markers = dataPts.map(function(p,i){
      var color = statusColorVar(dimData[i].status.cls);
      return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="var(--surface)" stroke="'+color+'" stroke-width="2.5"/>';
    }).join('');

    var labels = dimData.map(function(dd,i){
      var angle = (Math.PI*2 * i/n) - Math.PI/2;
      var lr = r + 32;
      var x = cx + lr*Math.cos(angle);
      var y = cy + lr*Math.sin(angle);
      var anchor = Math.abs(Math.cos(angle)) < 0.15 ? 'middle' : (Math.cos(angle) > 0 ? 'start' : 'end');
      return '<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-family="var(--font-mono)" font-size="10.5" fill="var(--text-secondary)">'+dd.dim.num+'</text>';
    }).join('');

    return '' +
    '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="320" role="img" aria-label="Radarchart Reifegrad je Dimension">' +
      gridPolys + spokes +
      '<polygon points="'+dataPolyStr+'" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>' +
      markers + labels +
    '</svg>';
  }

  function renderFooter(){
    return '<footer class="credit">Digital Defense Reifegradkompass &middot; Inhaltliche Grundlage: Digital_Defence_Ausarbeitung_Dimensionen &middot; Lokale Auswertung, keine Daten&uuml;bertragung</footer>';
  }

  // ============ EVENTS ============
  function afterRender(){
    var el;
    if(el = document.getElementById('btn-start')){ el.onclick = function(){ state.view='assessment'; state.dimIndex=0; saveState(); render(); }; }
    if(el = document.getElementById('btn-resume')){ el.onclick = function(){ state.view='assessment'; saveState(); render(); }; }
    if(el = document.getElementById('btn-reset')){ el.onclick = function(){ showConfirm('Gespeicherten Fortschritt wirklich löschen?', resetState); }; }
    if(el = document.getElementById('btn-prev')){ el.onclick = function(){ state.dimIndex = Math.max(0,state.dimIndex-1); saveState(); render(); }; }
    if(el = document.getElementById('btn-next')){ el.onclick = function(){ state.dimIndex = Math.min(DATA.length-1,state.dimIndex+1); saveState(); render(); }; }
    if(el = document.getElementById('btn-finish')){ el.onclick = function(){ state.view='results'; saveState(); render(); }; }
    if(el = document.getElementById('btn-results-early')){ el.onclick = function(){ state.view='results'; saveState(); render(); }; }
    if(el = document.getElementById('btn-continue')){ el.onclick = function(){ state.view='assessment'; saveState(); render(); }; }
    if(el = document.getElementById('btn-back-assessment')){ el.onclick = function(){ state.view='assessment'; saveState(); render(); }; }
    if(el = document.getElementById('btn-restart')){ el.onclick = function(){ showConfirm('Neue Bewertung starten? Der aktuelle Stand wird gelöscht.', resetState); }; }

    document.querySelectorAll('[data-goto-dim]').forEach(function(b){
      b.onclick = function(){ state.dimIndex = parseInt(b.getAttribute('data-goto-dim'),10); saveState(); render(); };
    });

    document.querySelectorAll('[data-slider]').forEach(function(input){
      input.addEventListener('input', function(){
        var idx = parseInt(input.getAttribute('data-slider'),10);
        var dim = DATA[state.dimIndex];
        var k = key(dim.id, idx);
        var val = parseInt(input.value,10);
        state.scores[k] = val;
        state.touched[k] = true;
        saveState();

        var card = input.closest('.aspect-card');
        card.classList.add('touched');
        var fillPct = ((val-1)/4*100);
        input.style.setProperty('--fill', fillPct+'%');
        var badge = card.querySelector('.stufe-badge');
        badge.textContent = 'Stufe '+val+' · '+STUFEN_NAMEN[val-1];
        var textEl = card.querySelector('[data-stufetext="'+idx+'"]');
        textEl.textContent = dim.aspects[idx].stufen[val-1];

        var pill = document.querySelector('.progress-pill .mono');
        if(pill) pill.textContent = touchedCount()+' / '+totalAspects()+' bewertet';
        var bar = document.querySelector('.bar-fill');
        if(bar) bar.style.width = Math.round((touchedCount()/totalAspects())*100)+'%';
        var pct = document.querySelector('.sidebar-progress .top .mono');
        if(pct) pct.textContent = Math.round((touchedCount()/totalAspects())*100)+'%';

        var navBtn = document.querySelector('.dim-nav-item.active .dim-nav-count');
        if(navBtn) navBtn.textContent = dimTouchedCount(dim)+'/'+dim.aspects.length;
      });
    });
  }

  render();
})();
</script>
